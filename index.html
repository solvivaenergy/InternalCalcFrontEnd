<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solviva Solar Calculator</title>
  <link rel="icon" type="image/png" href="/favicon-v2.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
  <!-- v3-157 — Mulish for the Mobile Flow: the Brand Book's approved alternate
       typeface (PolySans is the primary but is a paid license). Scoped to the
       .mfl root in MobileFlow.jsx; the desktop view's typography is untouched. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <meta name="description" content="Solviva Energy solar quote calculator. Estimate your savings, monthly payment, and payback period." />
  <meta name="x-solviva-build" content="v3-13 — Logo asset cache-bust: renamed to *-v2.png so browsers holding the old (JPEG-as-PNG) logos in cache fetch the new transparent ones (May 2026)" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fcfcfc;
    }

    /* ─────────────────────────────────────────────────────────────────
       v3-155 · Summary "Compare your payment terms" tenor rows.
       The rows became clickable in v3-153, but nothing INVITED the click —
       no hover feedback and no per-row selection indicator, so the table
       still read as a static comparison. Hover lives here rather than in the
       inline style objects because React inline styles cannot express :hover.
       Excluded from the PDF by the surrounding .no-pdf-capture section, so
       these states can never reach the proposal.
       ───────────────────────────────────────────────────────────────── */
    .tenor-row { transition: background-color 120ms ease; }
    .tenor-row:hover { background-color: #f2f4f7; }
    .tenor-row:hover .tenor-dot { border-color: #1F522B; }
    .tenor-row:focus-visible {
      outline: 2px solid var(--sv-primary);
      outline-offset: -2px;
    }
    /* Coarse pointers have no hover; the tint would latch on after a tap and
       read as a second selection alongside the real one. */
    @media (hover: none) {
      .tenor-row:hover { background-color: transparent; }
    }

    /* ─────────────────────────────────────────────────────────────────
       Step 3 + Step 4 side-by-side layout (v3-51)
       At desktop widths (≥1024px) Step 3 and Step 4 render in a 2-column
       grid so customers see Step 4's metrics react as they adjust Step 3
       controls. Below 1024px the grid collapses to a single column and
       Step 4's sticky-pin is disabled (sticky inside a full-width block
       would feel jarring during a normal vertical scroll).
       ───────────────────────────────────────────────────────────────── */
    @media (min-width: 1024px) {
      .step34-grid {
        grid-template-columns: 1.05fr 0.95fr !important;
        gap: 20px !important;
      }
    }
    @media (max-width: 1023px) {
      .step34-col-right {
        position: static !important;
      }
    }

    /* ─────────────────────────────────────────────────────────────────
       MOBILE-SPECIFIC RULES — apply at viewport < 768px
       Admin functionality is desktop-only, so we hide it on phones.
       Layouts stack vertically and use full width to avoid horizontal
       scrolling.
       ───────────────────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      /* Hide admin entry-point on mobile (per product direction:
         admin view and editing for desktop only) */
      .desktop-only-admin { display: none !important; }

      /* App container: tighter horizontal padding */
      .app-main {
        padding: 12px !important;
      }

      /* Header stacks vertically on mobile */
      .header-inner {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 12px !important;
        padding: 14px 16px !important;
      }
      .header-meta { font-size: 12px !important; line-height: 1.6 !important; }
      .header-meta strong { display: inline; }
      .header-actions {
        width: 100%;
        justify-content: flex-start !important;
      }
      .header-logo {
        max-width: 140px;
      }

      /* Tabs: smaller padding, scroll horizontally if needed */
      .tabs-inner {
        padding: 0 12px !important;
        overflow-x: auto;
      }
      .tab-btn {
        padding: 12px 14px !important;
        font-size: 13px !important;
        flex-shrink: 0;
      }

      /* Section cards: edge-to-edge, less padding */
      .section-card {
        border-radius: 0 !important;
        margin-left: -12px;
        margin-right: -12px;
        padding: 18px 16px !important;
      }

      /* Two-column grids collapse to single column */
      .grid-2col {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
      }
      /* Grid children default to `min-width: auto` (content-based), which
         lets them grow past their track. Force `min-width: 0` so descendant
         overflow-x:auto wrappers can actually clip and scroll horizontally
         instead of bursting their parents. Applies on both mobile and
         desktop so overflow handling is consistent. */
      .grid-2col > * {
        min-width: 0;
      }

      /* Step 3 / Step 4 metric tile grids: 2 columns on mobile, was 4 */
      .metric-tile-grid, .summary-tile-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
      }
      .metric-tile-grid > *, .summary-tile-grid > * {
        padding: 12px 14px !important;
      }
      .metric-tile-grid .stat-tile-value,
      .summary-tile-grid .stat-tile-value {
        font-size: 16px !important;     /* was 18 — ₱2,233,104 fits at 16 */
        line-height: 1.2 !important;
        word-break: break-word;          /* allow long values to wrap */
        overflow-wrap: anywhere;
      }

      /* Step 1 device rows: tighter spacing, smaller font */
      .device-rows-table {
        font-size: 12px !important;
        /* Force minimum table width so columns don't squish below readable
           sizes on phones. The wrapping <div> uses overflow-x:auto so the
           table scrolls horizontally when it doesn't fit. Without this
           min-width, the table tries to fit 5 cols + remove btn into ~360px
           and the device-name dropdown gets crushed to "— S". */
        min-width: 560px;
      }
      .device-rows-table input,
      .device-rows-table select {
        font-size: 13px !important;
        padding: 6px 8px !important;
      }
      .device-rows-table th,
      .device-rows-table td {
        padding: 4px 4px !important;
      }

      /* Step 2G misc materials table: same treatment — scroll horizontally
         on narrow viewports rather than clipping the right edge. */
      .step2g-misc-table {
        min-width: 460px;
      }

      /* Inputs need larger tap targets on mobile */
      input, select, button:not(.info-icon-btn) {
        min-height: 38px;
      }

      /* Inline fields stack on mobile */
      .field-inline {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 4px !important;
      }
      .field-inline label, .field-inline > label {
        margin-bottom: 2px;
      }

      /* Schedule of Payments table: smaller font, horizontal scroll fallback */
      .schedule-table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .schedule-table {
        font-size: 11px !important;
        min-width: 480px;
      }

      /* Subsection title and hint: stack on mobile */
      .subsection-hint {
        display: block !important;
        margin-top: 2px;
      }

      /* Recharts charts: ensure they don't overflow */
      .recharts-wrapper { max-width: 100% !important; }

      /* Coverage headline sentence: enforce single line on desktop via
         white-space:nowrap inline style. On mobile we release that so the
         sentence wraps and remains readable when the percentage is large. */
      .headline-sentence-wrap {
        white-space: normal !important;
        padding: 14px 16px !important;
      }

      /* Footer: shrink the company line */
      .footer-inner {
        font-size: 11px !important;
        padding: 10px 12px !important;
      }

      /* Contact gate edit form: stack the two columns */
      .contact-edit-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }
    }

    /* Print styles — hide nav and footer for clean PDFs */
    /* v3-129 — live bar: 4 cells desktop, 2×2 on narrow; divider only where
       a cell has a right-hand neighbour (structural, via nth-child). */
    .live-total-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* v3-161: IRR is the fifth cell */
      row-gap: 7px;
    }
    .live-total-cell { border-right: 1px solid rgba(255,255,255,0.18); }
    .live-total-cell:nth-child(5n) { border-right: none; }
    .live-total-spacer { height: 76px; }   /* v3-231: ≥ the bar's 72px so the footer above it is never covered */
    @media (max-width: 560px) {
      .live-total-grid { grid-template-columns: repeat(2, 1fr); }
      .live-total-cell { border-right: none; }
      .live-total-cell:nth-child(odd) { border-right: 1px solid rgba(255,255,255,0.18); }
      /* v3-161: five cells wrap to three rows at 2-col */
      .live-total-spacer { height: 156px; }
    }
    @media print {
      header, nav, footer, button { -webkit-print-color-adjust: exact; }
      [data-no-print] { display: none !important; }
      body { background: white !important; }
      main { padding: 12px !important; }
    }

    /* v3-231 — region theme. The calculator's PRIMARY fill (buttons, the
       phase toggle, table header rows, the live total bar, underlines, the
       focus ring) is a CSS variable so the active region recolours it in one
       place: Manila = the brand dark green with white text on it; Cebu = the
       brand lime #D2FF1E with dark green text on it (lime is a background
       colour in the brand kit — never white text on lime). App.jsx sets
       data-region on <html> once the region is known. TEXT that is dark green
       on a light background stays dark green in both regions: lime text on
       white is unreadable. */
    :root {
      --sv-primary: #1F522B;
      --sv-on-primary: #FFFFFF;
      --sv-on-primary-muted: rgba(255, 255, 255, 0.75);
      --sv-on-primary-soft: rgba(255, 255, 255, 0.8);
    }
    :root[data-region="cebu"] {
      --sv-primary: #D2FF1E;
      --sv-on-primary: #1F522B;
      --sv-on-primary-muted: rgba(31, 82, 43, 0.72);
      --sv-on-primary-soft: rgba(31, 82, 43, 0.8);
    }
    /* Numbers you READ (stat tiles, the Step 3E total card, the Summary total
       row, the mobile price hero): Manila keeps light tiles with dark-green
       figures; Cebu flips them to DARK GREEN tiles with LIME figures — the
       design system's chartreuse-on-dark-green pairing (7.8:1), the only way
       lime text stays readable. Controls keep the --sv-primary rule above. */
    :root {
      --sv-tile-bg: #f2f4f7;
      --sv-tile-border: #e4e7ec;
      --sv-tile-fg: #1F522B;
      --sv-tile-label: #667085;
      --sv-tile-sub: #667085;
      --sv-tile-strong: #212121;
      --sv-hero-bg: #1F522B;
      --sv-hero-fg: #FFFFFF;
      --sv-hero-muted: rgba(255, 255, 255, 0.82);
    }
    :root[data-region="cebu"] {
      --sv-tile-bg: #1F522B;
      --sv-tile-border: #1F522B;
      --sv-tile-fg: #D2FF1E;
      --sv-tile-label: rgba(255, 255, 255, 0.78);
      --sv-tile-sub: rgba(255, 255, 255, 0.78);
      --sv-tile-strong: #FFFFFF;
      --sv-hero-fg: #D2FF1E;
    }

    /* v3-231 — motion. Short, one-directional, easing out: content fades up
       as a tab pane or banner appears, dialogs pop in, the app fades in after
       sign-in or a region switch. Nothing loops, nothing moves on hover beyond
       the existing colour transitions, and everything is off under
       prefers-reduced-motion. */
    @keyframes svFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes svFadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes svPopIn {
      from { opacity: 0; transform: translateY(4px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    .app-root  { animation: svFadeIn 260ms ease-out both; }
    .tab-pane  { animation: svFadeUp 240ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .sv-fade-up { animation: svFadeUp 240ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .sv-overlay { animation: svFadeIn 160ms ease-out both; }
    .sv-dialog  { animation: svPopIn 200ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .tab-btn    { transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease; }
    button, .mfl-btn { transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease; }
    @media (prefers-reduced-motion: reduce) {
      .app-root, .tab-pane, .sv-fade-up, .sv-overlay, .sv-dialog { animation: none !important; }
      .tab-btn, button, .mfl-btn { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
