name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Update this to your Render backend URL
  RENDER_BACKEND_URL: "https://internalcalc-backend.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with environment variables
        env:
          VITE_API_BASE_URL: ${{ env.RENDER_BACKEND_URL }}
          VITE_AUDIT_PASSWORD: ${{ secrets.VITE_AUDIT_PASSWORD }}
          VITE_SUPERADMIN_PASSWORD: ${{ secrets.VITE_SUPERADMIN_PASSWORD }}
          VITE_ENGINEERING_PASSWORD: ${{ secrets.VITE_ENGINEERING_PASSWORD }}
          VITE_PRODUCT_PASSWORD: ${{ secrets.VITE_PRODUCT_PASSWORD }}
          VITE_REP_PASSWORD: ${{ secrets.VITE_REP_PASSWORD }}
          VITE_MAINTENANCE_PASSWORD: ${{ secrets.VITE_MAINTENANCE_PASSWORD }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
